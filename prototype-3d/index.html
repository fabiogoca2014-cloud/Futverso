<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Futverso 3D</title><style>body{margin:0;overflow:hidden;background:#10382c;color:white;font:16px system-ui;touch-action:none}canvas{display:block}#hud{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#081c19dd;padding:10px 22px;border-radius:14px;text-align:center;font-weight:bold}#menu{position:absolute;inset:0;display:grid;place-items:center;background:#092019ed;text-align:center}button{border:0;border-radius:30px;padding:16px;background:#38ed88;font-weight:bold;color:#092019}#pad{position:absolute;bottom:35px;left:28px;width:125px;height:125px;border-radius:100%;border:2px solid #ffffff66;background:#ffffff22}#knob{position:absolute;width:45px;height:45px;left:40px;top:40px;border-radius:50%;background:#fff9}#buttons{position:absolute;bottom:34px;right:18px;display:flex;gap:8px;align-items:end}#buttons button{width:72px;height:72px;padding:0;background:#eee}#buttons #shoot{height:90px;width:90px;background:#ffc946}#controls{display:none}#restart{position:absolute;top:14px;right:10px;padding:8px;font-size:12px}</style></head><body><div id="hud"><div id="clock">00:00</div><div id="score">AZUL 0 × 0 VERMELHO</div></div><button id="restart">REINICIAR</button><div id="controls"><div id="pad"><div id="knob"></div></div><div id="buttons"><button id="switch">TROCAR</button><button id="pass">PASSE</button><button id="shoot">CHUTE</button></div></div><div id="menu"><div><h1>⚽ FUTVERSO 3D</h1><p>Partida arcade 3D — seu time é o azul!</p><p>No PC: WASD, J (passe), K (chute), L (troca)</p><button id="start">COMEÇAR PARTIDA</button></div></div><script type="module" src="./game.js"></script></body></html>
